<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropTattva</title>
  <meta name="description" content="A proprietary data and intelligence platform being built for commercial real estate.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0a0a0a;
      --muted: #8a8a8a;
      --line: #e6e6e6;
      --bg: #ffffff;
      --gutter: clamp(16px, 2.6vw, 52px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 0 var(--gutter);
      height: 96px;
      border-bottom: 1px solid var(--line);
    }
    .wordmark { font-size: 15px; font-weight: 600; letter-spacing: 0.16em; }
    .firm { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(56px, 10vh, 140px) var(--gutter);
    }
    h1 {
      font-weight: 300;
      font-size: clamp(36px, 4.6vw, 68px);
      line-height: 1.17;
      letter-spacing: -0.02em;
      max-width: 13.5em;
    }
    .sub { margin-top: clamp(28px, 4vh, 48px); font-size: clamp(16px, 1.3vw, 18px); font-weight: 300; color: var(--muted); }

    .actions { margin-top: clamp(36px, 6vh, 64px); display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 26px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.04em;
      border: 1px solid var(--ink);
      border-radius: 2px;
      transition: background 0.15s, color 0.15s;
    }
    .cta:hover { background: #fff; color: var(--ink); }
    .cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .cta span { transition: transform 0.15s; }
    .cta:hover span { transform: translateX(3px); }
    .cta-secondary { background: #fff; color: var(--ink); }
    .cta-secondary:hover { background: var(--ink); color: #fff; }
    .cta small { font-size: 11px; font-weight: 400; opacity: 0.65; letter-spacing: 0.02em; }
    .ctas { display: flex; gap: 12px; flex-wrap: wrap; }
    .status { font-size: 13px; font-weight: 500; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }

    footer {
      padding: 0 var(--gutter);
      height: 136px;
      display: flex;
      align-items: center;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      header { height: 72px; }
      .firm { font-size: 12px; }
      footer { height: 96px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wordmark">PROPTATTVA</div>
    <div class="firm">A Kaspian Partners firm</div>
  </header>

  <main>
    <h1>A proprietary data and intelligence platform being built for commercial real estate.</h1>
    <p class="sub">Details in due course.</p>
    <div class="actions">
      <div class="ctas">
        <a class="cta" href="app/">Access Demo v2 <small>Platform</small> <span aria-hidden="true">→</span></a>
        <a class="cta cta-secondary" href="PT_Demo_v6.html">Access Demo v1 <small>Concept</small> <span aria-hidden="true">→</span></a>
      </div>
      <span class="status">Building now</span>
    </div>
  </main>

  <footer>© PropTattva 2026 - Bengaluru, India</footer>
</body>
</html>
