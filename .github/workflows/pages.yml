name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build prototype app
        working-directory: app
        run: npm ci && npm run build
      # Demos are not linked publicly. They are published only under a private
      # path held in the DEMO_PATH repo secret (the repo is public, so the path
      # must never be written in this file).
      - name: Assemble site (landing page at root, demos under private path)
        env:
          DEMO_PATH: ${{ secrets.DEMO_PATH }}
        run: |
          if [ -z "$DEMO_PATH" ]; then echo "DEMO_PATH secret is not set" >&2; exit 1; fi
          mkdir -p "_site/$DEMO_PATH/app"
          cp index.html CNAME _site/
          cp PT_Demo_v6.html "_site/$DEMO_PATH/"
          cp -r app/dist/. "_site/$DEMO_PATH/app/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
